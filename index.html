<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityStoreys</title>
  <meta property="og:title" content="CityStoreys">
<meta property="og:description" content="Navigate a story embedded in the city.">
<meta property="og:image" content="https://citystoreys.com/CityStoreys-preview-link-sharing.png">
<meta property="og:url" content="https://citystoreys.com">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CityStoreys">
<meta name="twitter:description" content="Navigate a story embedded in the city.">
<meta name="twitter:image" content="https://citystoreys.com/CityStoreys-preview-link-sharing.png">

  <style>
    @font-face {
      font-family: "Basenji";
      src: url("Basenji-SemiBold.otf") format("opentype");
      font-weight: 800;
      font-style: normal;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: #05070d;
      font-family: "Basenji", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 32px 20px;
      box-sizing: border-box;
    }

    main {
      width: 100%;
      max-width: 1100px;
    }

    h1 {
      margin: 0 0 42px;
      font-size: clamp(4.3rem, 15vw, 12rem);
      line-height: 0.82;
      font-weight: 800;
      letter-spacing: -0.06em;
    }

    .line-one,
    .line-two,
    .coming,
    .summer, {
      margin: 0 0 22px;
      font-weight: 800;
    }

    .line-one {
      font-size: clamp(1.2rem, 4vw, 2.6rem);
    }

    .line-two {
      font-size: clamp(1rem, 3.2vw, 2.1rem);
    }

    .coming,
    .summer {
      font-size: clamp(0.95rem, 2.8vw, 1.7rem);
    }

    .summer {
      margin-bottom: 42px;
    }
  
    .email {
      margin: 0;
      font-size: clamp(0.75rem, 2vw, 1rem);
      font-weight: 800;
    }
    @media (prefers-color-scheme: dark) 
    {html, body {background: #121615; color: #f2f0ea;} }
  </style>
</head>

<body>
  <main>
    <h1>CityStoreys</h1>
    <p class="line-one">Navigate a story embedded in the city.</p>
    <p class="line-two">The streets hold the clues — but your choices shape the journey.</p>
    <p class="coming">Urban odysseys coming to Toronto.</p>
    <p class="summer">Summer 2026</p>
    <p class="email">hello@citystoreys.com</p>
  </main>
</body>
</html>
